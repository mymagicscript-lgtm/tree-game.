<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Волшебное Древо Сефирот</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>✨ Растим Волшебное Древо</h1>
    <p class="subtitle">Отправьте 12 разных слов за сегодня — и только завтра утром откроется новое дерево!</p>

    <div class="stage">
      <img id="tree-img" src="1789320691951.jpg" alt="Стадия роста дерева">
    </div>

    <div class="counter">Слов отправлено: <span id="word-count">0 / 12</span></div>
    <div class="status-message" id="status-message">Загрузка...</div>

    <div class="input-box">
      <input type="text" id="word-input" placeholder="Напиши новое слово..." autocomplete="off">
      <button id="add-btn">Отправить</button>
    </div>

    <div class="words-cloud" id="words-cloud"></div>
  </div>

  <script src="script.js?v=100"></script>
</body>
</html>
